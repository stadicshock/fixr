# fixr configuration
# Copy this file to ~/.fixr/config.yaml and edit with your API keys.
#
# API keys can reference environment variables: ${ENV_VAR_NAME}
# This way you don't have to hardcode secrets in the config file.

# Which provider to use by default
default_provider: anthropic

providers:
  anthropic:
    api_key: ${ANTHROPIC_API_KEY}
    model: claude-sonnet-4-20250514

  openai:
    api_key: ${OPENAI_API_KEY}
    model: gpt-4o

  bedrock:
    region: us-east-1
    model_id: us.anthropic.claude-3-5-haiku-20241022-v1:0
    profile: ""                   # AWS profile name from ~/.aws/config (e.g. "lz-ai-ml-le")
    # Uses AWS credentials from ~/.aws/credentials or environment variables
    # No api_key needed — uses standard AWS credential chain

  ollama:
    host: http://localhost:11434
    model: llama3
    # Fully local — no data leaves your machine

# Preferences
preferences:
  tone: professional            # professional | casual | formal
  language: en-US
  hotkey: ctrl+shift+g          # Global hotkey (menu bar mode)
  auto_screenshot: true         # Auto-capture active window for context
  auto_paste: false             # Auto-paste corrected text back
